<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>floweryify</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>floweryify</h1>
      </header>

      <div class="controls">
        <label class="field">
          <span>upload an image</span>
          <input id="sourceInput" type="file" accept="image/*" />
        </label>

        <input id="preserveRange" type="range" min="0" max="100" value="35" />

        <button id="runButton" type="button" disabled>floweryify the image</button>
      </div>
      <h2>note that your image will be fit within the flowery image's width and height that was used.</br> your image may be streched or compressed.</br>
      if you copy the image, it would best be used for small reaction images.</h2>

      <div class="canvas-wrap">
        <canvas id="resultCanvas" width="212" height="228"></canvas>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
